{% extends "v3/final/base/base.html" %}

<div class="container">

        <ul>
            <li><a href="#">Upload Session</a></li>
            <li><a href="">Edit Session</a></li>
            <li><a href="">Reports</a></li>
        </ul>
    </div>
    <div class="row">
        <div class="col-xs-12">
            <div class="row">
                <div class="col-xs-12">

                    <div class="row">
                        <div class="col-xs-12">

                    </div>

            </div>
        </div>
    </div>
</div>
