<div class="row">
	<div class="col-lg-9 col-lg-offset-1">
		<div class="msg-container">
			{% if messages %}
			{% for msg in messages %}
			<div class="alert alert-{{msg.tags}} msg" role="alert">{{msg}}<a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a></div>
			{% endfor %}
			{% endif %}
		</div>
	</div>
</div>
<div class="row">
	<div class="col-lg-9 col-lg-offset-1">
			<a onclick="loadXMLDoc('/user/presenter/dash/?mysessions', '#page-content')">Back to my Sessions</a>
	</div>
</div>
<div class="row">
	<div class="col-lg-9 col-lg-offset-1">
	<video id="MY_VIDEO_1" class="video-js vjs-default-skin" controls
		preload="auto" width="100%" height="100" poster="MY_VIDEO_POSTER.jpg"
		data-setup="{}">
				{% if pd.edited %}
					{% if edit.audio_file %}
					<source src="/{{edit.audio_file}}" type='audio/mpeg'>
					{% else %}

					<source src="/{{pd.getAudioLocation}}" type='audio/mpeg'>
					{% endif %}
				{% else %}

					<source src="/{{pd.getAudioLocation}}" type='audio/mpeg'>
				{% endif %}
		<p class="vjs-no-js">To view this video please enable JavaScript 
		<a href="http://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a></p>
	</video>
	<h3>{{pd.name}}</h3>
	<img src="" alt="">
	<p>{{ pd.presenters.all|join:", "}}, {{presenter.credentials}}</p>
	<h4>Description</h4>
	<p>{{pd.description}}</p>
	</div>
</div>
