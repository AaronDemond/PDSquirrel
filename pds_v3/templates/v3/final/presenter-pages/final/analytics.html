{% load pds_extras %}
{% load staticfiles %}

{% block header-scripts %}
<script src="{% static 'js/presenter/analytics.js' %}"></script>
{% endblock %}

<div class="analytics-container">
    <div class="row" id="analytics-date">
        <div class="col-lg-9 col-lg-offset-1">
    	    <h4 style="margin-bottom: 0">Analytics</h4>
    	    <hr style="margin-top: 10px">
    	    <form id="analytics-form" action="{% url 'analytics-report' %}" method="POST">
    	        {% csrf_token %}
    	        <div class="row" style="margin-bottom:20px">
    	            <div class="col-lg-3">
    	                <label for="">Start (dd/mm/yyyy)</label>
    	                <input type="date" name="start" class="form-control" value="{{start.year}}-{% if start.month < 10 %}0{% endif %}{{start.month}}-{% if start.day < 10%}0{%endif%}{{start.day}}">
    	            </div>
    	            <div class="col-lg-3">
    	                <label for="">End (dd/mm/yyyy)</label>
    	                <input type="date" name="end" class="form-control" value="{{end.year}}-{% if end.month < 10 %}0{% endif %}{{end.month}}-{% if end.day < 10%}0{%endif%}{{end.day}}">
    	            </div>
    	            <div class="col-lg-2">
    	                <input type="hidden" name="date-rng">
    	                <input type="submit" style="margin-top: 25px" class="btn btn-success" onclick="$('#analytics-report').removeClass('hidden')" value="Generate report">
    	            </div>
    	        </div>
    	    </form>
        </div>
    </div>
	<div id="result">
	</div>
</div>
