
<script src="https://apis.google.com/js/platform.js" async defer></script>

<div id="social_media">
  <!-- Facebook -->
  <iframe
    src="https://www.facebook.com/plugins/share_button.php?href=https%3A%2F%2Fpdsquirrel.ca%2F{{ url|urlencode:"" }}&layout=button&mobile_iframe=true&width=59&height=20&appId"
    width="59"
    height="20"
    style="border:none;overflow:hidden"
    scrolling="no"
    frameborder="0"
    allowTransparency="true">
  </iframe>
  <!-- Twitter -->
  <a href="https://twitter.com/share" class="twitter-share-button" data-show-count="false">Tweet</a>
  <script async src="//platform.twitter.com/widgets.js" charset="utf-8"></script>
  <!-- LinkedIn -->
  <script src="//platform.linkedin.com/in.js" type="text/javascript"> lang: en_US</script>
  <script type="IN/Share" data-url="www.pdsquirrel.ca/{{url}}"></script>
  <!-- Google+ -->
  <div class="g-plus" data-action="share" data-annotation="none"></div>
</div>
